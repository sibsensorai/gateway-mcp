# Egress-страж ядра «Сибсенсор». Доступен только из внутренней docker-сети.
# ФАЗА 1 (наблюдение): пропускаем всё и логируем домены в stdout.
# ФАЗА 2: раскомментировать блок allowlist ниже и заменить
#         "http_access allow localnet" на "http_access allow localnet allowed".

http_port 3128

acl localnet src 172.16.0.0/12
acl localnet src 10.0.0.0/8
acl localnet src 192.168.0.0/16

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny !localnet

# --- ФАЗА 2: белый список доменов (пока выключен) ---
# acl allowed dstdomain .yandex.ru .yandex.net .yandex.com
# acl allowed dstdomain api.telegram.org
# acl allowed dstdomain .googleapis.com oauth2.googleapis.com
# acl allowed dstdomain .letsencrypt.org
# (добавим реальные домены из логов Фазы 1)

# ФАЗА 1: разрешаем всё из внутренней сети и логируем
http_access allow localnet
http_access deny all

access_log stdio:/dev/stdout squid
cache deny all
dns_v4_first on
shutdown_lifetime 5 seconds
